<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Repo Tree</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f4f0;
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: #25221e;
      }
      #view {
        position: absolute;
        inset: 0;
      }
      header {
        position: absolute;
        top: 20px;
        left: 24px;
        pointer-events: none;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 600;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        max-width: 420px;
        margin: 0;
        padding: 0;
        list-style: none;
        color: #7a746b;
        font-size: 12.5px;
      }
      li::before {
        content: '';
        display: inline-block;
        width: 12px;
        height: 8px;
        margin-right: 6px;
        border-radius: 0 8px 0 8px;
        background: var(--c);
      }
    </style>
  </head>
  <body>
    <div
      id="view"
      aria-label="3D tree of the repository. Drag to orbit, hover a branch to see its folder."
    ></div>
    <header>
      <h1 id="title"></h1>
      <ul id="legend"></ul>
    </header>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
