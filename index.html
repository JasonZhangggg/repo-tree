<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f4f0" />
    <meta
      name="description"
      content="Grow a low-poly tree from any public GitHub repository: folders fork, leaves are files."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Repo Tree</title>
  </head>
  <body>
    <div id="view" role="img" aria-label="3D tree of a repository"></div>
    <div id="labels" aria-hidden="true"></div>

    <header class="bar">
      <form class="repo" id="repo-form" role="search" novalidate>
        <label class="sr-only" for="repo-input">GitHub repository</label>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M9 19c-4 1.5-4-2-6-2.5m12 4.5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"
          />
        </svg>
        <input
          id="repo-input"
          name="repo"
          type="text"
          placeholder="owner/repo or GitHub URL"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="go"
          aria-describedby="repo-error"
          aria-controls="suggest"
          aria-expanded="false"
        />
        <button type="submit" class="go">Grow</button>
        <p class="field-error" id="repo-error" role="alert"></p>
        <div class="suggest" id="suggest" hidden></div>
      </form>
      <nav class="tools" aria-label="Tree actions">
        <button type="button" class="tool" id="search-open" aria-keyshortcuts="/">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m20 20-4.2-4.2" />
          </svg>
          <span class="label">Search folders</span><kbd>/</kbd>
        </button>
        <div class="tool-group" id="share-group" role="group" aria-label="Share">
          <button type="button" class="tool" id="share" aria-label="Copy link to this view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1" />
              <path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" />
            </svg>
            <span class="label">Share</span>
          </button>
          <button type="button" class="tool" id="export" aria-label="Export PNG">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14" />
            </svg>
            <span class="label">PNG</span>
          </button>
        </div>
        <div class="tool-group" role="group" aria-label="View">
          <button type="button" class="tool" id="theme" aria-label="Dark mode">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10Z" />
            </svg>
            <span class="label">Dark mode</span>
          </button>
          <button
            type="button"
            class="tool"
            id="settings-open"
            aria-label="Settings"
            aria-expanded="false"
            aria-controls="settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h10m4 0h2M4 17h2m4 0h10" />
              <circle cx="16" cy="7" r="2" />
              <circle cx="8" cy="17" r="2" />
            </svg>
          </button>
        </div>
        <button type="button" class="tool" id="signin" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 19c-4 1.5-4-2-6-2.5m12 4.5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"
            />
          </svg>
          <span class="label">Sign in</span>
        </button>
        <button
          type="button"
          class="tool more"
          id="more"
          aria-label="More actions"
          aria-expanded="false"
          aria-controls="more-menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="12" r="1.2" />
            <circle cx="12" cy="12" r="1.2" />
            <circle cx="18" cy="12" r="1.2" />
          </svg>
        </button>
        <div class="more-menu" id="more-menu" role="group" aria-label="More actions" hidden>
          <button type="button" class="tool" id="native-share" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15V4m-4 4 4-4 4 4" />
              <path
                d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v6A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-6a1.5 1.5 0 0 0-1.5-1.5H16"
              />
            </svg>
            <span class="label">Share…</span>
          </button>
          <a class="tool" id="open-github" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 5h5v5m0-5-8 8" />
              <path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4" />
            </svg>
            <span class="label">Open on GitHub</span>
          </a>
        </div>
      </nav>
    </header>

    <section class="title" id="title" aria-live="polite">
      <button
        type="button"
        class="repo-switch"
        id="repo-switch"
        aria-label="Change repository"
        aria-controls="repo-form"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M9 19c-4 1.5-4-2-6-2.5m12 4.5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"
          />
        </svg>
      </button>
      <h1>
        <button
          type="button"
          id="repo-link"
          aria-controls="repo-form"
          aria-expanded="false"
          aria-describedby="repo-link-hint"
        ></button>
      </h1>
      <span class="sr-only" id="repo-link-hint">Opens the repository field</span>
      <p class="meta" id="repo-meta"></p>
      <a class="weather" id="weather" target="_blank" rel="noopener" hidden></a>
      <div id="status"></div>
      <div class="compare" id="compare" role="group" aria-label="Compared tree" hidden></div>
    </section>

    <aside class="side" id="side" aria-label="Repository details">
      <button
        type="button"
        class="sheet-handle"
        id="sheet-toggle"
        aria-expanded="false"
        aria-controls="side-body"
      >
        <span class="grip" aria-hidden="true"></span>
        <span class="peek">
          <strong id="sheet-title">Folders and leaf colors</strong>
          <small id="sheet-stat"></small>
        </span>
      </button>
      <button
        type="button"
        class="close sheet-clear"
        id="sheet-clear"
        aria-label="Clear selection"
        hidden
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <div class="quick" id="quick"></div>
      <div class="side-body" id="side-body">
        <section class="panel color-by" id="color-by" aria-label="Color leaves by"></section>
        <section
          class="panel cmp-panel"
          id="compare-panel"
          aria-label="Side by side"
          hidden
        ></section>
        <article class="panel detail" id="detail" hidden aria-label="Pinned folder"></article>
        <section class="panel" id="overview">
          <h2 class="h">Top-level folders</h2>
          <ul id="folders" class="folders"></ul>
          <h2 class="h" id="legend-title">Leaf colors</h2>
          <ul id="legend" class="legend"></ul>
          <p class="more" id="legend-note" aria-live="polite"></p>
          <div class="hot" id="hot" hidden>
            <h2 class="h" id="hot-title">Busiest files</h2>
            <p class="more" id="hot-note" aria-live="polite"></p>
            <ol class="hot-files" id="hot-files" aria-labelledby="hot-title"></ol>
          </div>
        </section>
      </div>
    </aside>

    <div class="controls">
      <div class="scrubber" id="scrubber" role="group" aria-label="Timeline" hidden>
        <button type="button" class="scrub-play" id="timeline-play" aria-label="Play timeline">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5v11l9-5.5Z" /></svg>
        </button>
        <p class="scrub-when" aria-live="off">
          <strong id="timeline-date"></strong>
          <span id="timeline-files"></span>
        </p>
        <div class="scrub-track">
          <div class="scrub-ticks" id="timeline-ticks" aria-hidden="true"></div>
          <input
            type="range"
            id="timeline-range"
            min="0"
            max="1000"
            step="1"
            value="1000"
            aria-label="Timeline position"
          />
        </div>
        <button type="button" class="scrub-close" id="timeline-close" aria-label="Close timeline">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <button
        type="button"
        class="pill-btn primary"
        id="timeline"
        aria-pressed="false"
        aria-disabled="true"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5" />
          <path d="M4 4v4.5h4.5" />
          <path d="M12 8v4l2.5 1.5" />
        </svg>
        <span>Timeline</span>
      </button>
      <button
        type="button"
        class="pill-btn"
        id="compare-open"
        aria-label="Compare trees"
        aria-pressed="false"
        aria-disabled="true"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4v16" />
          <path d="M7 18v-4m0 0c-2 0-3-1.3-3-3 2 0 3 1.3 3 3Zm0-2c0-2 1-3 3-3 0 1.7-1 3-3 3Z" />
          <path d="M17 18v-5m0 1c-2 0-3-1.3-3-3 2 0 3 1.3 3 3Zm0-1c0-2 1-3 3-3 0 1.7-1 3-3 3Z" />
        </svg>
        <span>Compare</span>
      </button>
      <button
        type="button"
        class="pill-btn"
        id="grow"
        aria-keyshortcuts="g"
        aria-label="Grow again"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20v-8m0 2c-3 0-5-2-5-5 3 0 5 2 5 5Zm0-2c0-3 2-5 5-5 0 3-2 5-5 5Z" />
        </svg>
        <span>Grow again</span>
      </button>
      <button
        type="button"
        class="pill-btn"
        id="spin"
        aria-keyshortcuts="Space"
        aria-pressed="true"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12m6-12v12" /></svg>
        <span>Pause spin</span>
      </button>
      <button
        type="button"
        class="pill-btn reset-view"
        id="reset-view"
        aria-keyshortcuts="f"
        aria-label="Reset view"
        title="Reset view (F)"
        hidden
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9m6 0h3.5A1.5 1.5 0 0 1 20 5.5V9m0 6v3.5a1.5 1.5 0 0 1-1.5 1.5H15m-6 0H5.5A1.5 1.5 0 0 1 4 18.5V15"
          />
          <circle cx="12" cy="12" r="2.5" />
        </svg>
        <span>Reset view</span>
      </button>
      <p class="help" id="help">Drag to orbit · scroll to zoom · click a branch to pin</p>
    </div>

    <div id="tip" role="tooltip" hidden></div>
    <div class="scrim" id="search-scrim" hidden></div>
    <div
      class="dialog search"
      id="search"
      role="dialog"
      aria-modal="true"
      aria-label="Search folders and files"
      hidden
    ></div>
    <div
      class="dialog settings"
      id="settings"
      role="dialog"
      aria-labelledby="settings-title"
      hidden
    ></div>
    <div class="scrim" id="compute-scrim" hidden></div>
    <div
      class="dialog compute"
      id="compute"
      role="dialog"
      aria-modal="true"
      aria-labelledby="compute-title"
      hidden
    ></div>
    <div class="scrim" id="ci-scrim" hidden></div>
    <div
      class="dialog compute ci-card"
      id="ci-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ci-title"
      hidden
    ></div>
    <div class="scrim" id="pr-scrim" hidden></div>
    <div
      class="dialog compute ci-card pr-card"
      id="pr-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pr-title"
      hidden
    ></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
